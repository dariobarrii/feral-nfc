
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrar reseñas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #111;
      color: #f5f0e8;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 440px;
      margin: 40px auto;
      padding: 26px;
      background: #1d1b19;
      border: 1px solid #574638;
      border-radius: 16px;
    }
    h1 { font-size: 25px; }
    p { color: #c9c0b6; line-height: 1.5; }
    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
    }
    input, select, button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      font-size: 16px;
    }
    input, select {
      background: #292622;
      color: white;
      border: 1px solid #665746;
    }
    button {
      margin-top: 22px;
      border: 0;
      background: #a77b4d;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #status { margin-top: 18px; overflow-wrap: anywhere; }
    .note { font-size: 13px; }
  </style>
</head>
<body>
<main>
  <h1>Administrar reseñas</h1>
  <p>Ingresá el total de reseñas que aparece actualmente en Google.</p>

  <form id="reviewForm">
    <label for="restaurant">Restaurante</label>
    <select id="restaurant" required>
      <option value="Feral Steakhouse">Feral Steakhouse</option>
      <option value="Veta Steak House">Veta Steak House</option>
      <option value="Tzura Steak House">Tzura Steak House</option>
    </select>

    <label for="count">Total de reseñas en Google</label>
    <input id="count" type="number" min="0" step="1"
           placeholder="Ej. 657" required>

    <label for="token">Clave de administración</label>
    <input id="token" type="password" autocomplete="off"
           placeholder="Ingresá tu clave secreta" required>

    <button id="saveButton" type="submit">Guardar total</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>
  <p class="note">
    Este formulario guarda el total que ingresás; no consulta Google
    automáticamente ni garantiza que todas las reseñas sean publicadas.
  </p>
</main>

<script>
const SUPABASE_URL = "https://qcvhxrudzjlgqlhvnkkl.supabase.co";
const PUBLISHABLE_KEY = "sb_publishable_OpfoWwYD2lvC9dVTT_UT8A_Bvz_GKRw";

document.getElementById("reviewForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const restaurant = document.getElementById("restaurant").value;
  const reviewCount = Number(document.getElementById("count").value);
  const tokenInput = document.getElementById("token");
  const button = document.getElementById("saveButton");
  const status = document.getElementById("status");

  if (!Number.isSafeInteger(reviewCount) || reviewCount < 0) {
    status.textContent = "Ingresá un número entero válido.";
    return;
  }

  button.disabled = true;
  status.textContent = "Guardando...";

  try {
    const response = await fetch(
      `${SUPABASE_URL}/functions/v1/super-function`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": PUBLISHABLE_KEY,
          "Authorization": `Bearer ${PUBLISHABLE_KEY}`,
          "x-reviews-token": tokenInput.value
        },
        body: JSON.stringify({
          restaurant: restaurant,
          review_count: reviewCount
        })
      }
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || `Error HTTP ${response.status}`);
    }

    status.textContent =
      `Guardado correctamente: ${restaurant}, ${reviewCount} reseñas.`;
    tokenInput.value = "";
  } catch (error) {
    status.textContent =
      `No se pudo guardar. Revisá la clave y la conexión. ${error.message}`;
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>

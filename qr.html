<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Feral Steakhouse | QR de reseñas</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #d9b783;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    main { max-width: 420px; }
    p { color: #eee; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Feral Steakhouse</h1>
    <p id="status">Abriendo Feral Steakhouse en Google Maps…</p>
  </main>

  <script>
    const SUPABASE_URL = "https://qcvhxrudzjlgqlhvnkkl.supabase.co";
    const SUPABASE_KEY = "sb_publishable_OpfoWwYD2lvC9dVTT_UT8A_Bvz_GKRw";
    const RESTAURANT = "Feral Steakhouse";
    const EVENTS_TABLE = "nfc_events";

    // Abre la ficha de Feral por nombre y dirección.
    // Reemplazar por el enlace directo de reseñas cuando se confirme el place ID correcto.
    const GOOGLE_REVIEW_URL =
      "https://www.google.com/maps/search/?api=1&query=Feral%20Steakhouse%2C%20Carrer%20de%20C%C3%B2rsega%20231%2C%2008036%20Barcelona";

    async function registerQrScan() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 1800);

      try {
        await fetch(`${SUPABASE_URL}/rest/v1/${EVENTS_TABLE}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Prefer": "return=minimal"
          },
          body: JSON.stringify({
            restaurant: RESTAURANT,
            event: "qr_scan"
          }),
          signal: controller.signal
        });
      } catch (error) {
        console.error("No se pudo registrar el escaneo QR:", error);
      } finally {
        clearTimeout(timeout);
        window.location.replace(GOOGLE_REVIEW_URL);
      }
    }

    registerQrScan();
  </script>
</body>
</html>
